name: Deploy map builder to GitHub Pages

# Публикует карту (Godot-экспорт) + трекер Lancer (копируется из репозитория).
# Запускается только когда меняется проект карты или сам этот файл,
# поэтому правки трекера его не трогают.
on:
  push:
    branches: [main]
    paths:
      - 'project/**'
      - '.github/workflows/deploy-map.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Деплои на Pages идут строго по очереди (та же группа, что и у трекера),
# иначе два деплоя могут перезаписать друг друга.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot web export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-4.7.2-stable-web
      - name: Download Godot
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Download web export templates
        run: |
          if [ ! -f ~/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip ]; then
            curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
            mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
            unzip -q templates.tpz 'templates/web*' 'templates/version.txt' -d /tmp/godot_templates
            mv /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          fi
      - name: Export for the web
        run: |
          mkdir -p build/web
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path project --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"
      # Артефакт с чистым экспортом карты — его забирает workflow трекера,
      # чтобы не собирать Godot заново при каждой правке Lancer.
      # Хранится 90 дней (максимум); если протухнет — трекер честно упадёт
      # с понятной ошибкой, и надо будет один раз запустить этот workflow вручную.
      - name: Save map build for the Lancer workflow
        uses: actions/upload-artifact@v4
        with:
          name: map-build
          path: build/web
          retention-days: 90
      - name: Copy Lancer tracker into the site
        run: cp -r lancer build/web/lancer
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
